name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release-unsigned)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lint

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release-unsigned'
        run: ./gradlew assembleDebug

      - name: Build Release APK (unsigned)
        if: github.event.inputs.build_type == 'release-unsigned'
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release-unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: guarddroid-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK (unsigned)
        if: github.event.inputs.build_type == 'release-unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: guarddroid-release-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
          retention-days: 14

  test-api-levels:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [26, 29, 31, 33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x ./gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Instrumented Tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedAndroidTest
        continue-on-error: true

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: guarddroid-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ## GuardDroid ${{ github.ref_name }}

            ### Installation
            1. APK herunterladen
            2. "Unbekannte Quellen" temporär erlauben
            3. APK installieren
            4. Einrichtungsassistent starten

            ### Hinweis zu Device Owner
            Für vollständige Kinderschutzfunktionen (App-Sperren, App-Ausblenden):
            ```
            adb shell dpm set-device-owner dev.guarddroid.app/.receiver.GuardDroidAdminReceiver
            ```
            Dies muss vor dem ersten Start durchgeführt werden (Gerät darf keine Konten haben).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
